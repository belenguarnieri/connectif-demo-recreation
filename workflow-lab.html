<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flowmatic Demo — Arma tu Workflow</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="layout.css" />
<link rel="stylesheet" href="components.css" />
<link rel="stylesheet" href="workflow-lab.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>
    <main class="main">
      <header class="topbar">
        <h1 class="page-title" style="margin:0; font-size:22px;">🧩 Arma tu Workflow</h1>
        <div id="score-pill" class="badge">Puntaje: 0</div>
      </header>
      <div class="content">
        <div class="card" style="margin-bottom:20px;">
          <div id="challenge-goal" style="font-size:16px; color:var(--color-text-heading); margin-bottom:6px;"></div>
          <div id="challenge-desc" style="font-size:13px; color:var(--color-text-body);"></div>
        </div>

        <h2 class="section-title" style="margin-top:0;">Tu flujo</h2>
        <div id="drop-track" class="drop-track"></div>
        <div style="display:flex; gap:10px; margin: 16px 0 32px;">
          <button class="btn btn--primary" id="check-btn">Comprobar</button>
          <button class="btn btn--ghost" id="reset-btn">Reiniciar reto</button>
          <button class="btn btn--dark" id="next-btn" style="display:none;">Siguiente reto →</button>
        </div>
        <div id="feedback"></div>

        <h2 class="section-title">Paleta de nodos (arrastrá al flujo)</h2>
        <div id="node-palette" class="node-palette"></div>
      </div>
    </main>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="workflow-lab.js"></script>
  <script>initShell({ base: "", active: "workflows" });</script>
</body>
</html>
