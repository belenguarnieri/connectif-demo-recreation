<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flowmatic Demo — Quiz de Segmentación</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="layout.css" />
<link rel="stylesheet" href="components.css" />
<style>
  .quiz-card { max-width: 640px; margin: 0 auto; }
  .quiz-progress { font-size: 12px; color: var(--color-text-muted); margin-bottom: 10px; }
  .quiz-question { font-size: 18px; color: var(--color-text-heading); margin-bottom: 18px; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .quiz-option {
    text-align: left; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--color-border);
    background: #fff; cursor: pointer; font-family: var(--font-base); font-size: 14px; color: var(--color-text-body);
  }
  .quiz-option:hover { border-color: var(--color-primary); }
  .quiz-option.correct { border-color: var(--color-success); background: var(--color-success-bg); }
  .quiz-option.incorrect { border-color: var(--color-danger); background: var(--color-danger-bg); }
  .quiz-explain { font-size: 13px; background: var(--color-bg-soft); padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; display:none; }
  .quiz-final { text-align: center; }
  .quiz-final .big-score { font-size: 42px; color: var(--color-primary); }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>
    <main class="main">
      <header class="topbar">
        <h1 class="page-title" style="margin:0; font-size:22px;">🎯 Quiz de Segmentación</h1>
        <div id="score-pill" class="badge">Puntaje: 0</div>
      </header>
      <div class="content">
        <div class="card quiz-card" id="quiz-container"></div>
      </div>
    </main>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="segment-quiz.js"></script>
  <script>initShell({ base: "", active: "audience" });</script>
</body>
</html>
